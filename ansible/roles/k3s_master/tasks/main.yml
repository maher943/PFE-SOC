---
- name: Install K3s server
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      sh -s - server {{ k3s_server_extra_args }} --write-kubeconfig-mode {{ k3s_write_kubeconfig_mode }}
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s

- name: Wait for node-token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 180

- name: Read K3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_b64

- name: Expose token and server url as facts (for workers)
  ansible.builtin.set_fact:
    k3s_token: "{{ (k3s_node_token_b64.content | b64decode).strip() }}"
    k3s_server_url: "https://{{ ansible_facts['default_ipv4']['address'] }}:6443"