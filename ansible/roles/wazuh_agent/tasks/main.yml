---
# tasks file for wazuh-agent
- name: Install dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
    state: present
    update_cache: yes

- name: Add Wazuh GPG key
  shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | \
    gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    state: present

- name: Install Wazuh Agent
  apt:
    name: wazuh-agent
    state: present
    update_cache: yes

- name: Configure Wazuh Agent (manager IP)
  lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>.*</address>'
    line: "    <address>{{ wazuh_manager_ip }}</address>"
    backrefs: yes
  notify: restart wazuh-agent

- name: Start and enable Wazuh Agent
  systemd:
    name: wazuh-agent
    state: started
    enabled: yes