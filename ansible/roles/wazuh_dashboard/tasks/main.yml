---
# tasks file for wazuh_dashboard
- name: Install dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
      - debconf
      - adduser
      - procps
    state: present
    update_cache: yes

- name: Add Wazuh GPG key
  shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | \
    gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg \
    --import && chmod 644 /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh repository
  shell: |
    echo "deb [signed-by=/usr/share/keyrings/wazuh.gpg] \
    https://packages.wazuh.com/4.x/apt/ stable main" | \
    tee /etc/apt/sources.list.d/wazuh.list
  args:
    creates: /etc/apt/sources.list.d/wazuh.list

# --- Étape 1 : Installer Wazuh Dashboard ---
- name: Install Wazuh Dashboard
  apt:
    name: wazuh-dashboard
    state: present
    update_cache: yes

# --- Étape 2 : Déployer les certificats ---
# Le fichier /tmp/wazuh-certificates.tar a été généré par le rôle wazuh_indexer
- name: Verify certificates tar exists
  stat:
    path: /tmp/wazuh-certificates.tar
  register: certs_tar

- name: Fail if certificates tar not found
  fail:
    msg: "Le fichier /tmp/wazuh-certificates.tar est introuvable. 
          Assurez-vous que le rôle wazuh_indexer a été exécuté avant."
  when: not certs_tar.stat.exists

- name: Create certs directory
  file:
    path: /etc/wazuh-dashboard/certs
    state: directory
    mode: '0500'
    owner: wazuh-dashboard
    group: wazuh-dashboard

- name: Extract and deploy dashboard certificates
  shell: |
    tar -xf /tmp/wazuh-certificates.tar \
    -C /etc/wazuh-dashboard/certs/ \
    ./dashboard.pem ./dashboard-key.pem \
    ./root-ca.pem
    chmod 500 /etc/wazuh-dashboard/certs
    chmod 400 /etc/wazuh-dashboard/certs/*
    chown -R wazuh-dashboard:wazuh-dashboard /etc/wazuh-dashboard/certs
  args:
    creates: /etc/wazuh-dashboard/certs/dashboard.pem

# --- Étape 3 : Configurer le Dashboard ---
- name: Configure dashboard host
  lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^server.host:'
    line: 'server.host: "0.0.0.0"'
  notify: restart wazuh-dashboard

- name: Configure dashboard port
  lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^server.port:'
    line: 'server.port: 443'
  notify: restart wazuh-dashboard

- name: Configure Wazuh Indexer URL
  lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^opensearch.hosts:'
    line: 'opensearch.hosts: ["https://127.0.0.1:9200"]'
  notify: restart wazuh-dashboard

- name: Configure dashboard SSL certificate
  lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^server.ssl.certificate:'
    line: 'server.ssl.certificate: /etc/wazuh-dashboard/certs/dashboard.pem'
  notify: restart wazuh-dashboard

- name: Configure dashboard SSL key
  lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^server.ssl.key:'
    line: 'server.ssl.key: /etc/wazuh-dashboard/certs/dashboard-key.pem'
  notify: restart wazuh-dashboard

- name: Configure dashboard CA certificate
  lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^opensearch.ssl.certificateAuthorities:'
    line: 'opensearch.ssl.certificateAuthorities: ["/etc/wazuh-dashboard/certs/root-ca.pem"]'
  notify: restart wazuh-dashboard

# --- Étape 4 : Démarrer le Dashboard ---
- name: Start and enable Wazuh Dashboard
  systemd:
    name: wazuh-dashboard
    state: started
    enabled: yes

- name: Wait for Wazuh Dashboard to be ready
  wait_for:
    host: 127.0.0.1
    port: 443
    delay: 15
    timeout: 120