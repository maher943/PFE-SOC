---
# tasks file for wazuh_indexer
- name: Install dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
      - debconf
      - adduser
      - procps
    state: present
    update_cache: yes

- name: Add Wazuh GPG key
  shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | \
    gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg \
    --import && chmod 644 /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh repository
  shell: |
    echo "deb [signed-by=/usr/share/keyrings/wazuh.gpg] \
    https://packages.wazuh.com/4.x/apt/ stable main" | \
    tee /etc/apt/sources.list.d/wazuh.list
  args:
    creates: /etc/apt/sources.list.d/wazuh.list

# --- Étape 1 : Générer les certificats ---
- name: Download wazuh-certs-tool.sh
  get_url:
    url: https://packages.wazuh.com/4.14/wazuh-certs-tool.sh
    dest: /tmp/wazuh-certs-tool.sh
    mode: '0755'

- name: Download config.yml template
  get_url:
    url: https://packages.wazuh.com/4.14/config.yml
    dest: /tmp/config.yml

- name: Configure config.yml with localhost IPs
  copy:
    dest: /tmp/config.yml
    content: |
      nodes:
        indexer:
          - name: node-1
            ip: "127.0.0.1"
        server:
          - name: wazuh-1
            ip: "127.0.0.1"
        dashboard:
          - name: dashboard
            ip: "127.0.0.1"

- name: Generate certificates
  shell: bash /tmp/wazuh-certs-tool.sh -A
  args:
    chdir: /tmp
    creates: /tmp/wazuh-certificates/root-ca.pem

- name: Compress certificates into tar
  shell: |
    tar -cvf /tmp/wazuh-certificates.tar \
    -C /tmp/wazuh-certificates/ .
  args:
    creates: /tmp/wazuh-certificates.tar

# --- Étape 2 : Installer Wazuh Indexer ---
- name: Install Wazuh Indexer
  apt:
    name: wazuh-indexer
    state: present
    update_cache: yes

# --- Étape 3 : Déployer les certificats ---
- name: Create certs directory
  file:
    path: /etc/wazuh-indexer/certs
    state: directory
    mode: '0500'
    owner: wazuh-indexer
    group: wazuh-indexer

- name: Extract and deploy indexer certificates
  shell: |
    tar -xf /tmp/wazuh-certificates.tar \
    -C /etc/wazuh-indexer/certs/ \
    ./node-1.pem ./node-1-key.pem \
    ./root-ca.pem ./admin.pem ./admin-key.pem
    mv /etc/wazuh-indexer/certs/node-1.pem     /etc/wazuh-indexer/certs/indexer.pem
    mv /etc/wazuh-indexer/certs/node-1-key.pem /etc/wazuh-indexer/certs/indexer-key.pem
    chmod 500 /etc/wazuh-indexer/certs
    chmod 400 /etc/wazuh-indexer/certs/*
    chown -R wazuh-indexer:wazuh-indexer /etc/wazuh-indexer/certs
  args:
    creates: /etc/wazuh-indexer/certs/indexer.pem

# --- Étape 4 : Configurer et démarrer ---
- name: Configure network host
  lineinfile:
    path: /etc/wazuh-indexer/opensearch.yml
    regexp: '^network.host:'
    line: 'network.host: "127.0.0.1"'

- name: Start and enable Wazuh Indexer
  systemd:
    name: wazuh-indexer
    state: started
    enabled: yes

- name: Wait for Wazuh Indexer to be ready
  wait_for:
    host: 127.0.0.1
    port: 9200
    delay: 15
    timeout: 120

# --- Étape 5 : Initialiser la sécurité ---
- name: Initialize Wazuh Indexer security
  shell: /usr/share/wazuh-indexer/bin/indexer-security-init.sh
  args:
    creates: /tmp/.indexer-security-initialized

- name: Mark security as initialized
  file:
    path: /tmp/.indexer-security-initialized
    state: touch