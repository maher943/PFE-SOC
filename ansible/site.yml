---
- name: Preparation de base (tous les noeuds)
  hosts: all
  become: true
  roles:
    - common

- name: Installation K3s server (master)
  hosts: k3s_master
  become: true
  roles:
    - k3s_master

- name: Installation K3s agent (workers)
  hosts: k3s_workers
  become: true
  roles:
    - k3s_worker

# --- Nouveaux plays Wazuh ---
- name: Install Wazuh Manager
  hosts: wazuh_manager
  roles:
    - wazuh-manager

- name: Install Wazuh Agent
  hosts: wazuh_agent
  roles:
    - wazuh-agent